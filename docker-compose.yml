services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: notemind_user
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: notemind
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notemind_user -d notemind"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://notemind_user:devpassword@db:5432/notemind
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: